services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hookrelay
      POSTGRES_USER: hookrelay
      POSTGRES_PASSWORD: hookrelay
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama: