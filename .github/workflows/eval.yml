# Runs the full AI diagnosis eval against a real model. Manual only: pulling a
# model and running CPU inference takes several minutes. Start it from the
# Actions tab with "Run workflow", optionally choosing a model.
name: ai-eval
on:
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model to evaluate
        default: qwen3:1.7b
      min_accuracy:
        description: Fail below this accuracy (0-1)
        default: "0.8"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null || (ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break; sleep 2; done
          ollama pull "${{ inputs.model }}"
      - name: Run eval (development set)
        run: go run ./cmd/eval -model "${{ inputs.model }}" -min-accuracy "${{ inputs.min_accuracy }}" -out eval-results.json
      - name: Run eval (held-out set)
        if: always()
        run: go run ./cmd/eval -model "${{ inputs.model }}" -scenarios evals/holdout.json -out eval-holdout.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval-*.json
