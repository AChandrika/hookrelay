# Serves the dashboard and forwards API calls, so the browser talks to one
# origin (the same job the Vite proxy does in development).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's internal DNS. Resolving at request time (via the variable below)
    # means nginx keeps working when the api container is restarted.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8080;

    location /v1/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
