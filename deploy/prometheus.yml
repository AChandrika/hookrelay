global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]

  # dns_sd finds every worker replica: Docker's DNS returns one address per
  # container for the service name "worker".
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9091
        refresh_interval: 15s
